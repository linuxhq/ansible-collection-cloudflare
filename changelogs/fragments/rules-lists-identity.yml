---
bugfixes:
  - rules_lists - fail before any request when two C(hostname) elements repeat a C(url_hostname), or two C(redirect)
    elements repeat a C(source_url) in the form Cloudflare stores it, with other fields that differ. Cloudflare rejects
    them as duplicates after the list was created.
  - rules_lists - fail before any request when a C(hostname) element sets C(exclude_exact_hostname=false) for a hostname
    that is not a wildcard. Cloudflare rejects it after the list was created.
  - rules_lists - compare a C(redirect.source_url) element in the form Cloudflare stores it, with C(/) for a missing
    path, a lowercase scheme, no empty port, no brackets around an IPv6 address, and C(%3F) decoded to C(?). Every run
    wrote such items again and then failed because Cloudflare did not apply them.
  - rules_lists - fail before any request when a C(redirect.source_url) element includes a query string, a fragment,
    userinfo, or a port, uses a scheme other than C(http) or C(https), or has a scheme without C(//) and a host.
    Cloudflare rejects it after the list was created.
