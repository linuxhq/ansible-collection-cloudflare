---
bugfixes:
  - devices_policy - match a split tunnel route that sets C(description) to V("") and another field to null with the
    stored route Cloudflare returns without both, instead of editing the policy on every run and then failing because
    the policy did not apply.
  - pages_projects - fail before any request when a domain name label starting with C(xn--) is not the valid punycode
    form of an internationalized label, such as C(xn--zz), instead of creating or updating the project and then
    failing when Cloudflare rejects the domain.
  - rules_lists - fail before any change when a C(redirect.source_url) uses a scheme without C(://), such as
    C(http:example.com), has a non-numeric port, or an empty one without a scheme, such as C(example.com:/), has an
    unbracketed IPv6 host, or has a C(%) outside a percent-escape, instead of creating the list and then failing when
    Cloudflare rejects the item.
  - rules_lists - fail before any change when a C(redirect.target_url) starts with whitespace, contains an ASCII
    control character such as a tab or newline, or has a C(%) outside a percent-escape, instead of creating the list
    and then failing when Cloudflare rejects the item.
  - access_policies - compare O(approval_groups) exactly, so a key removed from a group, such as C(approvals_needed),
    updates the policy instead of being reported as unchanged and left in place.
  - access_apps - compare the C(approval_groups) and C(connection_rules) of an inline policy exactly, so a key
    removed from them updates the application instead of being reported as unchanged and left in place.
