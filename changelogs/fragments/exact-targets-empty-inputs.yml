---
bugfixes:
  - pagerules - match a page rule only when its stored targets equal the requested targets. A partial target matched
    any stored page rule, so O(state=absent) could delete, and O(state=present) update, an unrelated rule.
  - rulesets - reject an empty C(id) or C(ref) in a rule before any request. Cloudflare assigned the rule its own value
    instead, so the module wrote the ruleset and then failed on every run.
  - access_apps - match V(false) for C(allow_all_headers), C(allow_all_methods), C(allow_all_origins), or
    C(allow_credentials), and V(0) for C(max_age), in O(cors_headers) with an application whose CORS headers omit
    them. Cloudflare omits these defaults, so the module wrote the application and then failed on every run.
  - access_apps - match V(false) for C(approval_required), C(isolation_required), or C(purpose_justification_required)
    in an inline policy with a policy that omits them. Cloudflare omits these defaults, so the module wrote the
    application and then failed on every run.
  - access_apps - reject an empty O(session_duration) before any request. Cloudflare stored V(24h) instead, so the
    module wrote the application and then failed on every run.
  - access_policies, access_apps - reject an empty C(email_list_uuid) in an approval group before any request.
    Cloudflare dropped it, so the module wrote the policy or application and then failed on every run.
  - pages_projects - reject an empty C(wrangler_config_hash) or C(placement.mode) in O(deployment_configs) before any
    request. Cloudflare dropped the hash and stored an empty placement, so the module wrote the project and then
    failed on every run.
  - zones - reject an empty mapping at any level of a C(aegis), C(nel), or C(security_header) setting value before
    any request. Cloudflare accepted it but left the stored value unchanged,
    so the module wrote the setting and then failed on every run.
