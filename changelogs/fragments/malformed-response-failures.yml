---
bugfixes:
  - modules - fail naming the operation and resource, instead of with a Python traceback, when the SDK raises an
    error outside its API error types, such as for a 2xx response it cannot read (a body that is not JSON, an
    envelope that is not an object, or a list page whose result is not a list). A body that is not JSON is
    returned with its status code.
  - modules - report ``changed=true`` on any Cloudflare API or SDK failure after Cloudflare answered a write of
    the run with a 2xx status.
  - cfd_tunnel_configurations, cfd_tunnel_configurations_info - fail cleanly when Cloudflare returns a tunnel
    configuration, or its ``config``, that is not a mapping, instead of with a Python traceback; a null ``config``
    still counts as empty.
  - devices_policy, devices_settings, dnssec, zerotrust_connectivity_settings - fail cleanly before any change when
    Cloudflare returns current settings that are not a mapping, instead of with a Python traceback; only null
    settings count as empty.
  - devices_policy - treat split tunnel routes Cloudflare returns as something other than a list of mappings as a
    difference instead of failing with a Python traceback; after the update, such routes fail as not applied with
    ``changed=true``.
  - dnssec - treat a DNSSEC status Cloudflare returns as something other than a string as a difference instead of
    failing with a Python traceback; after the update, it fails as not applied with ``changed=true``.
  - pagerules, pagerules_info - fail cleanly, instead of with a Python traceback, when Cloudflare lists page rules
    that are not a list of mappings; only a null list counts as no page rules.
  - pagerules - fail cleanly, instead of with a Python traceback, when a page rule's ``targets`` or ``actions`` are
    not a list of mappings; after a create or update, the failure reports ``changed=true`` and the page rule.
  - rulesets - fail cleanly, instead of with a Python traceback, when a ruleset's ``rules`` are not a list of
    mappings; a null ``rules`` still counts as no rules, and after a create or update the failure reports
    ``changed=true`` and the ruleset.
  - rules_lists - fail cleanly, instead of with a Python traceback, when a list's ``num_items`` is missing or not a
    number, when a page of listed items is not a list, which the SDK would read as an empty last page, when a
    listed item is not a mapping holding a value of the list's kind, or when the items operation or its status is
    not a mapping; after a write, these failures report ``changed=true``.
  - pages_projects - fail cleanly, instead of with a Python traceback, when a project's ``deployment_configs`` is not
    a mapping; after a create or update, the failure reports ``changed=true`` and the project. Deleting such a
    project still works.
