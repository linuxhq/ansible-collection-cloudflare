---
bugfixes:
  - plugins - fail before any request when a module's O(account_id), O(zone_id), O(tunnel_id), or the
    rulesets O(phase) is C(.) or C(..), instead of crashing with a ValueError when the cloudflare SDK builds the
    request path.
  - zones - fail before any request when a C(settings[].id) is C(.) or C(..), instead of crashing with a ValueError
    when the cloudflare SDK builds the request path.
  - pages_projects - fail before any request when O(name) is C(.) or C(..), instead of crashing with a ValueError
    when the cloudflare SDK builds the request path.
  - pages_projects - skip another Pages project that is deleted while the module checks which project has a
    requested domain, instead of failing when Cloudflare reports that project as not found.
  - rules_lists - fail before any change when a C(redirect.target_url) has whitespace in its authority or a port that
    is not only digits, such as C(https://example.com:abc/), instead of creating the list and then failing when
    Cloudflare rejects the item.
  - access_apps - fail before any request when a C(policies) entry sets C(account_id), which Cloudflare accepts but
    does not return, instead of updating the application on every run and then failing because the policies did not
    apply.
