---
bugfixes:
  - access_groups, access_policies, access_apps - reject unknown nested fields in Access selectors of a known type
    before any request, such as a field other than C(email) in an C(email) selector. Cloudflare accepted and dropped
    them, so the module wrote the group, policy, or application and then failed because Cloudflare did not apply it,
    on every run.
  - access_policies - reject unknown fields in C(approval_groups) entries before any request. Cloudflare accepted and
    dropped them, so the module wrote the policy and then failed on every run.
  - access_apps - reject unknown fields in C(cors_headers), C(destinations) entries, C(policies) entries, and inline
    policy C(approval_groups) entries before any request. Cloudflare accepted and dropped them, so the module wrote the
    application and then failed on every run.
  - pagerules - reject unknown fields in C(targets), their C(constraint), C(actions), and the C(value) of
    C(forwarding_url) and C(cache_key_fields) actions before any request. Cloudflare accepted and dropped them, so the
    module wrote the page rule and then failed on every run.
  - zones - reject unknown fields in the object values of the C(aegis), C(automatic_platform_optimization), C(nel), and
    C(security_header) settings before any request. Cloudflare accepted and dropped them, so the module wrote the
    setting and then failed on every run.
