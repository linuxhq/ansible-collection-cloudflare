---
bugfixes:
  - access_groups, access_policies, access_apps - reject an Access selector of a known type whose value is not a
    mapping, such as a null C(any_valid_service_token), before any request. Cloudflare stored it with V({}), so the
    module wrote the group, policy, or application and then failed because Cloudflare did not apply it, on every run.
  - access_apps - reject an empty C(overrides) list in a C(destinations) entry before any request. Cloudflare stored
    the destination without C(overrides), so the module wrote the application and then failed on every run.
  - pagerules - reject C(value) on the C(always_use_https), C(disable_apps), C(disable_performance),
    C(disable_security), and C(disable_zaraz) actions before any request. Cloudflare stored these actions without
    C(value), so the module wrote the page rule and then failed on every run.
