---
bugfixes:
  - cfd_tunnel_configurations, pages_projects, rulesets - do not reject a key set to null that the module checks for
    an SDK spelling or a setting Cloudflare does not store, such as a tunnel C(origin_request), an unknown Pages
    project setting, or a rule's C(action_parameters.max_age). A key set to null is not sent, or Cloudflare drops
    it, so it counts as omitted.
  - rulesets - name the rule in the failure for an SDK spelling of a cache-control action parameter, such as
    C(rules[1].action_parameters.max_age).
  - cfd_tunnel_configurations - accept a O(tunnel_id) in uppercase. Cloudflare resolves tunnel IDs
    case-insensitively and returns them in lowercase, so the module failed with "returned the wrong cloudflared
    tunnel".
  - roles - set the inputs of each dependency whose facts a README example reads, such as C(accounts_info) and
    C(access_policies_info), and define every other variable the examples use, so they run as written.
  - cfd_tunnel_info, rulesets_info, warp_connector_info, zones roles - list the API token permissions the role's own
    module needs in the README, such as C(Zone Settings) write for zone settings and C(Zone) read for zone lookups.
trivial:
  - Molecule scenarios - protect calls whose results include secrets with C(no_log) and C(diff=false).
