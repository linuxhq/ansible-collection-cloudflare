---
bugfixes:
  - access_apps, access_groups, access_policies, access_service_tokens, cfd_tunnel, cfd_tunnel_configurations, dns,
    dnssec, pages_projects, purge_cache, rules_lists, rulesets, warp_connector, zones roles - report a change when
    ``<role>_async`` is ``0``, and wait only for unfinished jobs so a ``<role>_poll`` above ``0`` no longer fails with
    "could not find job".
  - access_service_tokens role - print the service token from every job result, including synchronous and inline-polled
    ones, so ``access_service_tokens_display`` shows new client secrets for every ``access_service_tokens_async`` and
    ``access_service_tokens_poll`` value.
