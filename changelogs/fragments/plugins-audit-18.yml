---
bugfixes:
  - access_apps, access_apps_info, access_groups, access_groups_info, access_identity_providers_info, access_policies,
    access_policies_info, access_service_tokens, access_service_tokens_info, accounts_info, cfd_tunnel,
    cfd_tunnel_configurations_info, cfd_tunnel_info, devices_policy_info, devices_settings_info, dnssec_info,
    pagerules, pagerules_info, pages_projects, pages_projects_info, rules_lists, rules_lists_info, rulesets,
    warp_connector, warp_connector_info, zerotrust_connectivity_settings_info, zones - name the resource's owner,
    such as C(account_id) or C(zone_id), and its identifier or name in every failure, including malformed or
    ambiguous lookup results and refused changes such as a C(rules_lists) kind change or a C(rulesets) rename.
    These failures previously named neither.
  - pages_projects - return the written project as C(pages_project) when reading the project again after adding
    its domains fails. The failure reported C(changed=true) and the added domains, but not the project.
  - pagerules, zones - treat a delete Cloudflare answers with a 400 status and the error code for an invalid
    identifier, 1002 for a page rule and 1001 for a zone, as deleted. The SDK retries a delete whose response was
    lost, and Cloudflare answers the retry with this error, so the module failed although the resource was deleted.
  - dnssec, pagerules, pagerules_info, purge_cache roles - document that the API token also needs C(Zone Read),
    which the C(zones_info) dependency or the zone lookup uses.
  - zones role - document that the API token also needs C(Account Settings Read), which the C(accounts_info)
    dependency uses.
