---
minor_changes:
  - dns role - pass each record's C(comment) and C(tags) to C(community.general.cloudflare_dns). A record that omits
    them has its comment or tags cleared, as C(community.general.cloudflare_dns) does.
bugfixes:
  - access_groups, access_policies, cfd_tunnel_configurations, pagerules, purge_cache, rulesets - do not send keys set
    to null inside nested values, such as an Access selector's configuration, an approval group, a tunnel
    C(originRequest), a page rule target or action value, a C(files) entry's C(headers), or a rule's
    C(action_parameters). The comparison already treated them as omitted, but Cloudflare received them.
  - rulesets_info - omit a zone deleted after the zones are listed. Cloudflare answers the entrypoint request for
    such a zone with a 403 status, so the module failed with an authentication error; the zone is now read again and
    omitted when Cloudflare reports that it no longer exists. Any other 403 still fails the module.
  - pagerules_info - document the C(priority) and C(status) returned for each page rule.
  - cfd_tunnel_configurations role - set the C(cfd_tunnel_info) dependency's account and API token in the example
    playbook, which the dependency needs to publish C(_cfd_tunnel_info_dict).
  - dns role - document that the API token also needs C(Zone Read), which C(community.general.cloudflare_dns) uses
    to look up the zone by name.
