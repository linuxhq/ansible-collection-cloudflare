---
bugfixes:
  - access_groups, access_policies, access_apps - match a C(github-organization) selector whose C(id) is null with
    the stored selector that holds the id Cloudflare assigned. The module previously compared the assigned id with the
    null request, so the group, policy, or application was written and then failed on every run.
  - access_policies - match an empty O(approval_groups) list with a policy without approval groups. Cloudflare clears
    the groups and omits them, so the module cleared them and then failed on every run.
  - access_policies, access_apps - reject an empty C(email_addresses) list in an approval group before any request.
    Cloudflare dropped it, so the module wrote the policy or application and then failed on every run.
  - access_apps - reject an empty C(approval_groups) list in an inline policy before any request. Cloudflare dropped
    it, so the module wrote the application and then failed on every run.
  - access_apps - reject an empty C(allowed_headers), C(allowed_methods), or C(allowed_origins) list in
    O(cors_headers), and an empty C(purpose_justification_prompt) or C(session_duration) in an inline policy, before
    any request. Cloudflare dropped them, so the module wrote the application and then failed on every run.
  - access_apps - reject an empty O(destinations) list before any request. Cloudflare replaced it with a C(public)
    destination for O(domain), so the module wrote the application and then failed on every run.
  - rulesets - reject an empty C(rulesets) list in the C(action_parameters) of a rule before any request. Cloudflare
    dropped it, so the module wrote the ruleset and then failed on every run.
