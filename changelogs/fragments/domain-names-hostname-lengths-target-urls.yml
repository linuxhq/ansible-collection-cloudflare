---
bugfixes:
  - pages_projects - fail before any request when a C(domains[].name) has a character other than an ASCII letter, digit,
    C(.), or C(-), a trailing C(.), an empty label, a label that starts or ends with C(-), a label over 63 characters, or
    more than 253 characters, instead of creating or updating the project and then failing when Cloudflare rejects the
    domain.
  - rules_lists - fail before any change when a hostname C(url_hostname) has a label over 63 characters or more than 253
    characters, not counting a single trailing C(.), instead of creating the list and then failing when Cloudflare
    rejects the item.
  - rules_lists - fail before any change when a redirect C(target_url) is not an absolute C(http) or C(https) URL with a
    host, such as C(www.example.org/d) or C(/path), instead of creating the list and then failing when Cloudflare
    rejects the item.
