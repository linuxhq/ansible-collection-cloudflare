---
bugfixes:
  - access_service_tokens - fail with ``changed=true`` and the token when a created token has no client secret, as
    when the create response is lost and the token is found by name afterwards. Cloudflare returns the client secret
    only in the create response, so the module reported the token created without it and the next run reported it
    present. Rotate or delete such a token to obtain a new client secret.
trivial:
  - cloudflare_utils - drop the mapping checks of listed items in ``find_resource`` and ``matching_resources``, as
    generated SDK list methods always return models.
  - access_policies - add examples for approval and for an absent policy.
