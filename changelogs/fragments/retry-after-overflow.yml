---
bugfixes:
  - modules - fail naming the operation and resource, instead of with a Python traceback, when the SDK reads an
    out-of-range ``Retry-After`` date before retrying a request, or a response body nested too deeply to decode;
    after Cloudflare answered a write of the run with a 2xx status, the failure reports ``changed=true``.
  - modules - wait the default backoff, instead of failing with a Python traceback, before retrying a create that
    Cloudflare rejected with a 409 or 429 status and an out-of-range ``Retry-After`` date.
  - pages_projects - stop reading the custom domains of a project at the first empty page, instead of requesting
    every page up to the ``total_pages`` Cloudflare reports.
  - rulesets_info - return falsy ruleset ``rules`` other than null unmodified; only null ``rules`` are returned as
    ``[]``.
