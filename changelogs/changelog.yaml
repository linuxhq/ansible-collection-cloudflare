ancestor: null
releases:
  1.2.0:
    changes:
      release_summary: Final 1.x release. All 1.x releases are deprecated and no longer
        receive updates; please upgrade to 2.0.0 or later.
    release_date: '2024-03-31'
  2.0.0:
    changes:
      breaking_changes:
      - access_apps - renamed from ``access_app``.
      - access_apps_info - renamed from ``access_app_info``.
      - access_groups - renamed from ``access_group``.
      - access_groups_info - renamed from ``access_group_info``.
      - access_policies - renamed from ``access_policy``.
      - access_policies_info - renamed from ``access_policy_info``.
      - access_service_tokens - renamed from ``access_service_token``.
      - access_service_tokens_info - renamed from ``access_service_token_info``.
      - accounts_info - renamed from ``account_info``.
      - cfd_tunnel - renamed from ``tunnel``.
      - cfd_tunnel_info - renamed from ``tunnel_info``.
      - network - removed.
      - pagerules - renamed from ``page_rule``.
      - pagerules_info - renamed from ``page_rule_info``.
      - pages_projects - merged the ``pages_domain`` and ``pages_projects`` roles.
      - pages_projects_info - renamed from ``pages_project_info``.
      - rules_lists - renamed from ``rule_list``.
      - rules_lists_info - renamed from ``rule_list_info``.
      - rulesets - renamed from ``ruleset_entrypoint``.
      - rulesets_info - renamed from ``ruleset_entrypoint_info``.
      - scrape_shield - removed.
      - security - removed.
      - ssl - removed.
      - zones - renamed from ``zone``.
      - zones_info - renamed from ``zone_info``.
      minor_changes:
      - all - added ``check_mode`` support to avoid failures.
      - all - added ``state`` support to all applicable roles.
      - all - added example inventory and playbooks.
      - all - added molecule tests to every role.
      - all - the ansible-lint configuration no longer carries any exclusions.
      - purge_cache - new role for purging the Cloudflare cache.
      release_summary: Restructures the entire collection. Most roles have been renamed
        and several deprecated roles were removed, so all inventory and playbooks
        must be updated when upgrading from 1.x. See the provided examples.
    release_date: '2025-11-06'
  2.0.1:
    changes:
      minor_changes:
      - access_apps - added support for the ``destinations`` option.
      release_summary: Adds support for the ``destinations`` option in the ``access_apps``
        role, allowing multiple domains to be associated with a single application.
    release_date: '2025-11-08'
  2.0.2:
    changes:
      minor_changes:
      - devices_policy - new role for managing device policies.
      - devices_policy_info - new role for gathering device policies.
      - devices_settings - new role for managing device settings.
      - devices_settings_info - new role for gathering device settings.
      - warp_connector - new role for managing WARP connectors.
      - warp_connector_info - new role for gathering WARP connectors.
      - zerotrust_connectivity_settings - new role for managing Zero Trust connectivity
        settings.
      - zerotrust_connectivity_settings_info - new role for gathering Zero Trust connectivity
        settings.
      release_summary: Introduces eight new roles for Cloudflare WARP and Zero Trust
        device management.
    release_date: '2025-11-22'
  2.0.3:
    changes:
      minor_changes:
      - dnssec - new role for managing zone DNSSEC settings.
      - dnssec_info - new role for gathering zone DNSSEC settings.
      release_summary: Introduces the ``dnssec`` and ``dnssec_info`` roles.
    release_date: '2025-11-26'
  2.0.4:
    changes:
      minor_changes:
      - access_identity_providers_info - new role for gathering Access identity providers.
      - access_policies - added a meta dependency on ``access_identity_providers_info``.
      release_summary: Introduces the ``access_identity_providers_info`` role.
    release_date: '2026-01-16'
  2.0.5:
    changes:
      breaking_changes:
      - cfd_tunnel - ``config_src`` must now be defined for each tunnel in inventory.
      minor_changes:
      - all - removed ``box_architecture`` from the molecule configuration.
      - all - removed tags from the molecule verify plays.
      - cfd_tunnel - added support for Cloudflare-managed tunnels.
      - cfd_tunnel_configurations - new role for managing tunnel configurations.
      - cfd_tunnel_configurations_info - new role for gathering tunnel configurations.
      release_summary: Adds support for Cloudflare-managed tunnels, including new
        roles for managing and inspecting tunnel configurations.
    release_date: '2026-02-23'
  2.0.6:
    changes:
      breaking_changes:
      - devices_policy - defaults have been broken out into individual role variables.
      - pages_projects - DNS record management has been removed; use the ``dns`` role
        instead.
      minor_changes:
      - all - added async support to the applicable roles.
      - all - migrated every role from ``uri`` wrappers to custom Ansible modules.
      release_summary: Replaces the ``uri``-based API wrappers with custom Ansible
        modules built on the official ``cloudflare`` Python SDK, and adds async support
        to the applicable roles. Review the breaking changes before upgrading.
    release_date: '2026-05-11'
  2.0.7:
    changes:
      minor_changes:
      - access_service_tokens - no longer passes the unsupported ``per_page`` parameter
        when looking up service tokens.
      release_summary: Fixes access service token lookups by no longer passing the
        unsupported ``per_page`` parameter.
    release_date: '2026-05-11'
  2.0.8:
    changes:
      minor_changes:
      - all - added support for agent workflows.
      - all - general module cleanup.
      release_summary: Adds agent workflow support and applies general module cleanup.
    release_date: '2026-05-28'
  2.0.9:
    changes:
      minor_changes:
      - all - refactored every module to follow the updated development guidelines.
      - all - updated the plugin development guidelines.
      release_summary: Maintenance release that refreshes the plugin development guidelines
        and refactors all modules to follow them. No functional changes.
    release_date: '2026-06-03'
  2.1.0:
    changes:
      breaking_changes:
      - access_apps - the ``type`` option is restricted to ``self_hosted``, ``ssh``,
        and ``vnc``.
      - access_policies - removed the ``precedence`` option; the account-level Access
        policy API does not accept it.
      - zones - removed the ``internal`` zone type.
      bugfixes:
      - all - numerous idempotency and convergence fixes, including complete pagination
        in lookups and info modules, write-only secret comparison, preserved omitted
        fields on update, and stricter bulk-operation handling.
      minor_changes:
      - all - resource lookups use server-side filters and follow API pagination where
        supported.
      - cfd_tunnel, pages_projects, warp_connector - added ``rotate_secrets`` to apply
        write-only secrets to existing resources.
      - galaxy.yml - constrained ``community.general`` to ``<11.0.0`` for ansible-core
        2.15 compatibility.
      - rules_lists - added ``operation_timeout`` to bound bulk item operations.
      release_summary: Hardening release. Modules follow API pagination, converge
        more reliably, and handle Cloudflare errors and long-running operations predictably.
        Review the breaking changes before upgrading.
      security_fixes:
      - access_apps, access_apps_info, access_identity_providers_info - secret fields
        in SCIM and identity provider responses are redacted.
      - examples, cfd_tunnel - removed a hardcoded tunnel secret; provide ``CLOUDFLARE_TUNNEL_SECRET``
        via the environment instead.
      - pages_projects - ``deployment_configs`` is not logged; it can contain ``secret_text``
        values.
    release_date: '2026-07-14'
  2.1.1:
    changes:
      bugfixes:
      - access_apps - the ``type`` option is no longer restricted to a subset of application
        types; ``warp`` and other valid Cloudflare Access application types are accepted
        again.
      release_summary: Bugfix release that restores support for all Cloudflare Access
        application types.
    release_date: '2026-07-14'
  2.1.10:
    changes:
      release_summary: Maintenance release aligning agent setup guidance, completing
        role dependency documentation and metadata, standardizing Molecule warning
        settings, and removing unused Vagrant development dependencies.
    fragments:
    - final-collection-cleanup.yml
    release_date: '2026-09-10'
  2.1.11:
    changes:
      bugfixes:
      - cfd_tunnel_configurations - compare ingress Access authentication independently
        of global Access settings so enabling required JWT validation is applied.
      - cfd_tunnel_configurations - detect removed optional configuration fields and
        validate their removal after updating, while normalizing origin defaults.
      - pagerules and pagerules_info - disable pagination for the unpaginated Page
        Rules endpoint to prevent repeated requests for zones with 50 or more rules.
      - rules_lists - interrupt bulk submission and polling at the operation deadline,
        including responses that continue delivering data slowly.
      - rulesets - reject unsupported ruleset kinds before API requests to prevent
        creating custom rulesets that entrypoint lookups cannot manage.
      release_summary: Patch release hardening explicit API-token authentication and
        tunnel credential redaction, correcting tunnel configuration comparisons and
        Page Rules pagination, and enforcing Rules list operation deadlines and supported
        ruleset kinds. The minimum supported Cloudflare SDK version is now 5.7.0.
      security_fixes:
      - cfd_tunnel - redact connector tokens and tunnel credentials from returned
        tunnel data.
      - cloudflare_client - prevent ambient Cloudflare email and global API key credentials
        from overriding the explicitly supplied API token.
      - cloudflare_client - prevent authentication headers from CLOUDFLARE_CUSTOM_HEADERS
        from overriding the explicitly supplied API token, regardless of header casing.
    fragments:
    - custom_auth_headers.yml
    - plugin-review-fixes.yml
    - plugin_review_fixes.yml
    - plugins-audit.yml
    - release-2.1.11.yml
    - token_authentication.yml
    release_date: '2026-09-18'
  2.1.2:
    changes:
      breaking_changes:
      - Raised the minimum supported ansible-core version to 2.18.0 and the community.general
        dependency to ``>=12.0.0,<14.0.0``.
      bugfixes:
      - access_groups - paginate the name lookup so groups beyond the first page of
        name-filter matches are found instead of recreated.
      - access_service_tokens - paginate the name lookup so tokens beyond the first
        page of name-filter matches are found instead of recreated.
      - pages_projects_info - paginate the Pages projects listing so accounts with
        more projects than one API page return complete results.
      release_summary: Maintenance release. Listing and name lookups follow API pagination
        everywhere, and the collection now requires ansible-core 2.18 and community.general
        12.
    fragments:
    - community_general_12.yml
    - pagination_fixes.yml
    - release_summary.yml
    release_date: '2026-07-16'
  2.1.3:
    changes:
      breaking_changes:
      - zones_info - removed the ``page`` and ``per_page`` options; the module now
        follows API pagination and returns all zones.
      release_summary: Pagination release. ``zones_info`` follows API pagination and
        returns all zones; the ``page`` and ``per_page`` options were removed. Review
        the breaking change before upgrading.
    fragments:
    - release_summary.yml
    - zones_info_pagination.yml
    release_date: '2026-07-16'
  2.1.4:
    changes:
      breaking_changes:
      - all modules - the collection now requires ``cloudflare >= 5.5.0, < 6``; support
        for the 4.x SDK has been dropped (https://github.com/linuxhq/ansible-collection-cloudflare/pull/32).
      release_summary: Dependency release. The collection now requires the cloudflare
        Python SDK 5.x (``cloudflare >= 5.5.0, < 6``); support for the 4.x SDK has
        been dropped. Review the breaking change before upgrading.
    fragments:
    - cloudflare-sdk-v5.yml
    release_date: '2026-07-18'
  2.1.5:
    changes:
      release_summary: 'Maintenance release. The resource and info modules were refactored
        to the

        documented house layout: resource modules now dispatch state through

        ``ensure_present`` and ``ensure_absent`` helpers, and info modules through

        ``list``/``info`` helpers. This is an internal restructure only; no options,

        return values, or behavior changed.

        '
    fragments:
    - ensure-helpers-refactor.yml
    release_date: '2026-07-21'
  2.1.6:
    changes:
      minor_changes:
      - all modules - raise the required cloudflare Python SDK floor to ``cloudflare
        >= 5.6.0, < 6`` (https://github.com/linuxhq/ansible-collection-cloudflare/pull/41).
      release_summary: 'Maintenance release. The required cloudflare Python SDK floor
        moves to ``cloudflare >= 5.6.0, < 6``. The remaining changes are internal:
        the modules dropped their Python 2 boilerplate and shebangs, and the lint
        configuration was simplified for ruff 0.16. No options, return values, or
        behavior changed.'
    fragments:
    - cloudflare-sdk-5.6.yml
    release_date: '2026-07-24'
  2.1.7:
    changes:
      bugfixes:
      - access groups and policies - ignore provider-only nested response fields during
        idempotence comparisons.
      - all modules - encode dynamic API path segments and query values before sending
        raw SDK requests.
      - cfd_tunnel_configurations - accept an unconfigured remote tunnel as an empty
        configuration instead of reporting malformed API data.
      - pagerules - follow API pagination when locating existing rules.
      - rules_lists - consume the SDK item iterator, validate bulk operations, and
        enforce the operation deadline.
      - zones - update zone properties in one request and validate settings before
        creating or changing a zone.
      minor_changes:
      - all modules - expand Ansible documentation for nested return values, check-mode
        support, requirements, and stable response fields.
      - all modules - validate required Cloudflare response fields before reporting
        successful operations.
      release_summary: Plugin hardening release that improves API response validation,
        pagination, idempotence, secret handling, and Ansible documentation across
        the collection.
    fragments:
    - plugin-audit.yml
    release_date: '2026-08-09'
  2.1.8:
    changes:
      bugfixes:
      - Access application, group, and policy managers - verify that mutation responses
        contain the requested configuration before reporting success.
      - SDK-backed modules - preserve operation and resource context in sanitized
        failures from generated client calls.
      - access_apps and pages_projects - reject blank or padded application domains
        and production branch names before making Cloudflare API calls.
      - access_identity_providers_info - accept Cloudflare's empty display name for
        the built-in one-time PIN provider.
      - access_service_tokens - verify that create and update responses reflect the
        requested token duration.
      - accounts_info - return an empty mapping rather than null when no account matches
        the requested name.
      - cfd_tunnel - require an unambiguous local-management signal before sending
        a tunnel secret during rotation.
      - cfd_tunnel - verify that creation returns the requested immutable configuration
        source.
      - cfd_tunnel_configurations - verify that update responses contain the requested
        tunnel configuration before reporting success.
      - cfd_tunnel_configurations_info - skip locally managed tunnels identified by
        either documented configuration-source field.
      - cfd_tunnel_info role - expose token retrieval through the secure-by-default
        C(cfd_tunnel_info_include_token) variable.
      - devices_settings - document C(disable_for_time) in the seconds expected by
        Cloudflare instead of incorrectly describing it as minutes.
      - dnssec - verify that update responses contain every requested setting before
        reporting success.
      - dnssec and dnssec_info - document the complete public DNSSEC response schema.
      - dnssec_info - keep skipped-zone error and message list elements as mappings
        when Cloudflare returns malformed structured details.
      - dnssec_info - keep skipped-zone error and message result fields as lists when
        Cloudflare returns malformed structured error data.
      - dnssec_info - preserve zone context in generic SDK failures.
      - info modules - reject malformed resources missing documented identity fields.
      - manager modules - reject malformed mutation responses missing documented identity
        and setting fields.
      - manager modules - verify create, update, and documented delete responses identify
        the requested resource.
      - module utilities - continue pagination for full bare-list response pages.
      - module utilities - preserve explicit null result fields in successful API
        envelopes, including valid delete responses.
      - module utilities - preserve the raw API operation and encoded path in sanitized
        failures.
      - module utilities - reject contradictory pagination metadata instead of silently
        returning an incomplete resource list.
      - module utilities - reject malformed pagination metadata, including empty pages
        with invalid counts.
      - module utilities - reject mismatched provider page and item-count metadata
        instead of returning duplicated or incomplete resource lists.
      - module utilities - reject non-string provider names during resource lookup
        instead of treating malformed resources as absent.
      - module utilities - reject successful API envelopes missing their required
        result field instead of treating them as empty data.
      - module utilities - serialize Cloudflare SDK models in JSON mode so datetime
        response fields are safe for Ansible results.
      - module utilities - validate pagination metadata before yielding items so early-exit
        resource lookups cannot bypass malformed-page detection.
      - modules with secret rotation - reject rotation requests that omit the credential
        input instead of silently reporting no change.
      - pagerules - fail on ambiguous duplicate target matches instead of mutating
        an arbitrary page rule.
      - pagerules - ignore provider-added nested response fields when matching and
        comparing managed page rule configuration.
      - pagerules - reject malformed target elements before matching page rules.
      - pagerules - verify that create and update responses contain the requested
        target constraints before reporting success.
      - pagerules and rulesets - reject malformed provider collection fields instead
        of treating them as missing or empty state.
      - pagerules and rulesets - verify that mutation responses contain the complete
        requested rule configuration before reporting success.
      - pagerules_info - validate documented action and target collections before
        returning provider data.
      - pages_projects - do not let an unobservable write-only analytics token force
        repeated updates unless secret rotation is requested.
      - pages_projects - reject malformed project domain collections instead of treating
        strings or mappings as domain lists.
      - pages_projects - reject whitespace-padded domain names returned by Cloudflare.
      - pages_projects - require an actual write-only credential before forced secret
        rotation instead of repeatedly updating plain-text deployment configuration.
      - pages_projects - validate requested domain names before making Cloudflare
        API calls.
      - pages_projects - verify observable project fields in mutation responses before
        reporting success.
      - pages_projects and zones - document conditional collection results according
        to when the modules actually return them.
      - purge_cache - enforce shared token and identifier validation in check mode
        without opening an SDK client.
      - rules_lists - allow operation polling to use the documented one-second timeout
        instead of failing early when less than one second remains.
      - rules_lists - keep bulk-item submission requests within the remaining operation
        timeout instead of rounding subsecond budgets up to one second.
      - rules_lists - omit the conditional bulk-operation result for metadata-only
        changes instead of returning null for a documented dictionary.
      - rules_lists - re-read list items after a completed bulk operation and fail
        if the requested contents were not applied.
      - rules_lists - reject attempts to change an existing list's immutable kind.
      - rules_lists - reject malformed bulk-operation identifiers before using them
        in API paths.
      - rules_lists - submit the same normalized, deduplicated items used for idempotence
        comparisons.
      - rules_lists - verify that create and update responses contain the requested
        list metadata before reporting success.
      - rulesets - reject malformed rule elements instead of returning or comparing
        non-mapping values.
      - rulesets - verify that fetched and mutated entrypoints belong to the requested
        phase, and that created rulesets have the requested kind.
      - rulesets_info - omit conditional ruleset identifiers and phases when a zone
        has no entrypoint instead of returning null string fields.
      - settings managers - verify that update responses contain every requested setting
        before reporting success.
      - tunnel modules - validate the documented base64 encoding and minimum decoded
        length of tunnel secrets before calling Cloudflare, and reject secrets for
        remotely managed cloudflared tunnels.
      - warp_connector - retain manual cleanup guidance and the created connector
        ID when a secret rollback returns malformed response data.
      - warp_connector - roll back a newly created connector when the secret update
        returns malformed or mismatched resource data.
      - warp_connector - verify secret-application rollback deletes the connector
        that was just created.
      - warp_connector_info role - expose token retrieval through the secure-by-default
        C(warp_connector_info_include_token) variable.
      - zones - reject duplicate setting identifiers before issuing contradictory
        updates.
      - zones - verify that create and update responses contain the requested account
        and zone configuration before reporting success.
      - zones - verify that setting update responses contain the requested normalized
        value before reporting success.
      security_fixes:
      - Access and Pages modules - recursively remove credential fields from malformed
        or unexpectedly nested provider response structures.
      - Access application modules - remove SaaS client secrets as well as SCIM credentials
        from returned applications.
      - Pages project modules - redact C(secret_text) values and web analytics tokens
        from manager and info results, and mark their inputs as sensitive so Ansible
        masks project credentials.
      - Pages project modules - redact secret values nested in canonical and latest
        deployment summaries.
      - connector info modules - retrieve sensitive connector tokens only when explicitly
        requested.
      - dnssec_info - redact sensitive values from structured errors returned for
        skipped zones.
    fragments:
    - plugin-pagination-items.yml
    release_date: '2026-08-11'
  2.1.9:
    changes:
      minor_changes:
      - Development and CI tooling - migrate collection checks from Make to Tox and
        expand unit and sanity testing across supported Ansible versions.
    fragments:
    - tox-tooling.yml
    release_date: '2026-08-13'
  2.2.0:
    changes:
      breaking_changes:
      - access_apps - O(app_launcher_visible), O(auto_redirect_to_identity), O(enable_binding_cookie),
        O(http_only_cookie_attribute), and O(session_duration) no longer have defaults.
        When omitted, an existing application's value is carried over on update and
        nothing is sent on create, where Cloudflare applies the same defaults; previously
        any update reset values set outside Ansible. A change to a type that does
        not store a setting does not carry it over.
      - access_apps role - pass C(app_launcher_visible), C(auto_redirect_to_identity),
        C(enable_binding_cookie), C(http_only_cookie_attribute), and C(session_duration)
        only when the list item sets them, instead of forcing Cloudflare's defaults.
      - access_apps, access_apps_info, access_identity_providers_info, cfd_tunnel,
        cfd_tunnel_info, pages_projects, pages_projects_info, rulesets, rulesets_info,
        warp_connector, warp_connector_info - return every field Cloudflare sends,
        including secrets such as tunnel credentials, client secrets, and the Pages
        web analytics token, instead of redacting them. Failure output also includes
        Cloudflare error responses unmodified. Protect results that hold secrets.
      - access_apps, access_groups, access_policies, access_service_tokens, accounts_info,
        cfd_tunnel, rules_lists, warp_connector, zones - fail when more than one resource
        matches O(name), naming the matching IDs, instead of silently updating, deleting,
        or returning whichever match Cloudflare lists first.
      - access_groups - O(is_default) no longer defaults to V(false). When omitted,
        an existing group's default status is carried over on update and nothing is
        sent on create; previously any update of the account's default group without
        O(is_default=true) cleared its default status.
      - access_groups role - pass C(is_default) only when the list item sets it, instead
        of forcing V(false).
      - access_policies - O(approval_required), O(isolation_required), and O(purpose_justification_required)
        no longer default to V(false). When omitted, an existing policy's value is
        carried over on update and nothing is sent on create, where Cloudflare also
        defaults to V(false); previously any update reset values set outside Ansible.
      - access_policies role - pass C(approval_required), C(isolation_required), and
        C(purpose_justification_required) only when the list item sets them, instead
        of forcing V(false).
      - cfd_tunnel - fail before any change, including O(rotate_secrets), when O(config_src)
        differs from the existing tunnel's configuration source, naming both values.
        The mismatch was previously ignored.
      - cfd_tunnel_configurations - fail before any change, including in check mode,
        when the tunnel is locally managed (C(config_src=local)). Cloudflare accepted
        the configuration and irreversibly converted the tunnel to remote management,
        which cfd_tunnel then refused.
      - cfd_tunnel_configurations - no longer compare C(warp-routing) in O(config).
        Cloudflare ignores it in tunnel configurations and manages WARP routing at
        the account level, so requesting it could never converge.
      - devices_settings, zerotrust_connectivity_settings - options no longer default
        to V(false) or V(0); omitted options leave the current setting unchanged instead
        of resetting it. The roles pass their variables explicitly, so role behavior
        is unchanged.
      - dnssec role - stop sending C(status=active) for zones that omit C(status),
        so DNSSEC is left unchanged unless a status is requested.
      - pagerules role - apply page rules one at a time, in list order, instead of
        as concurrent asynchronous jobs. Concurrent jobs for the same zone read a
        stale rule count, so rules that set C(priority) failed or landed in the wrong
        order. Remove the C(pagerules_async), C(pagerules_batch), C(pagerules_delay),
        C(pagerules_poll), and C(pagerules_retries) variables.
      - pagerules role - stop sending C(status=active) for rules that omit C(status),
        so a rule disabled outside Ansible stays disabled. New rules still default
        to C(active).
      - purge_cache - reject cache keys other than C(purge_everything), C(files),
        C(tags), C(hosts), and C(prefixes) before calling Cloudflare.
      - rules_lists - O(operation_timeout) now bounds each submission and polling
        request by the remaining budget instead of enforcing a hard wall-clock deadline
        with an alarm signal.
      - rulesets - compare each rule in O(rules) on all of its top-level fields, so
        a field omitted from a rule, such as C(description) or C(action_parameters),
        is removed instead of kept until an unrelated update silently dropped it.
        Fields Cloudflare assigns (C(id), C(ref), C(version), and C(last_updated))
        are ignored unless set, and a C(skip) rule without C(logging) matches Cloudflare's
        default C(logging.enabled=true).
      - warp_connector - no longer delete a newly created connector when applying
        O(tunnel_secret) to it fails. The module fails, naming the connector ID in
        the message and in C(warp_connector_id) and returning the error's status code
        and response. The connector remains without the requested secret, and later
        runs report it present because the secret cannot be read, so rerun with O(rotate_secrets=true)
        to apply it.
      - zones role - stop sending C(type=full) for zones that omit C(type), so an
        existing partial or secondary zone is never converted. New zones still default
        to C(full).
      - zones_info - remove the C(match) option, which had no effect because the module
        sends no zone filter. Remove it from tasks that set it.
      - zones_info role - remove the C(zones_info_match) variable, which only set
        the removed C(match) option.
      bugfixes:
      - access_apps - accept V("") for C(custom_deny_message), C(custom_deny_url),
        C(logo_url), and C(same_site_cookie_attribute) on application types that do
        not store them, such as V(bookmark) and V(proxy_endpoint). Cloudflare accepts
        V("") and drops the setting, but the module failed before any request.
      - access_apps - allow changing O(domain) when O(destinations) is omitted; the
        kept destinations made Cloudflare reject the update.
      - access_apps - an inline policy entry is now compared as the policy's complete
        definition. Cloudflare replaces the inline policy on every application update,
