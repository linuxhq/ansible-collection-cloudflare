        partial settings converge.
      - zones - document the C(enabled) field returned for flag-style settings.
      - zones - fail before any request when a C(settings[].id) is C(.) or C(..),
        instead of crashing with a ValueError when the cloudflare SDK builds the request
        path.
      - zones - fail before any request when a setting C(value) is null, or when a
        field Cloudflare stores in the object value of C(aegis), C(nel), or C(security_header)
        is null at any level, such as a null C(enabled) of C(nel), other than the
        C(pool_id) of C(aegis). Cloudflare stored a different value, such as V(false),
        or rejected the null after an earlier zone or setting write in the same run.
      - zones - fail before any request when the value of C(aegis), C(nel), or C(security_header),
        or the C(strict_transport_security) value of C(security_header), is not a
        mapping, such as V(on) for C(nel). Cloudflare rejected it, possibly after
        an earlier zone or setting write in the same run.
      - zones - ignore a trailing dot in O(name), which Cloudflare stores without
        it. The module created the zone and then failed on every run.
      - zones - manage settings Cloudflare exposes as an C(enabled) flag, such as
        C(ssl_recommender).
      - zones - match whole-number float setting values, such as C(min_tls_version)
        V(1.0), against the string Cloudflare stores, so the setting converges instead
        of failing after the update.
      - zones - match zone names case-insensitively.
      - zones - name the zone, and its account when O(zones#module:account_id) is
        set, when deleting the zone fails, and omit C(account_id) from a failed create
        instead of reporting it as null when it is not set.
      - zones - read every requested O(settings) entry before the zone or any setting
        is changed and fail, naming the setting, when a differing setting is not editable
        on the zone, such as C(polish) on a Free plan. Earlier settings, O(type),
        and O(vanity_name_servers) were written before Cloudflare rejected it. Check
        mode predicts the failure for an existing zone. A new zone must be created
        before its settings can be read, so it is created first.
      - zones - reject an empty mapping at any level of a C(aegis), C(nel), or C(security_header)
        setting value before any request. Cloudflare accepted it but left the stored
        value unchanged, so the module wrote the setting and then failed on every
        run.
      - zones - reject unknown fields in the object values of the C(aegis), C(nel),
        and C(security_header) settings before any request. Cloudflare accepted and
        dropped them, so the module wrote the setting and then failed on every run.
      - zones - scope zone lookups to O(account_id) when provided, so a same-named
        zone in another account is never updated or deleted.
      - zones - update O(type) and O(vanity_name_servers) in separate requests because
        Cloudflare edits only one zone property per request.
      - zones role - document that the API token also needs C(Account Settings Read),
        which the C(accounts_info) dependency uses.
      - zones, pages_projects - document that C(settings) and C(domains) are returned
        only when O(state=present) changes something outside check mode, and that
        C(domains) lists the domains added during the run.
      - zones_info - include internal zones, which Cloudflare omits unless the zone
        types are named.
      - zones_info role - build C(_zones_info_dict) from non-internal zones only,
        so an internal zone never shadows a public zone with the same name. C(_zones_info_list)
        still includes internal zones.
      minor_changes:
      - Modules validate input only to prevent a crash, a partial change, a run that
        never converges, or an action on the wrong resource; other input now reaches
        Cloudflare, and the module reports Cloudflare's error.
      - access_apps - no longer check inline policy C(mfa_config) keys, or destination
        keys for types other than C(public) and C(private).
      - access_apps, access_groups, access_policies - reject an empty string only
        in the C(account_id) of a C(cloudflare_account_member) or C(device_posture)
        selector and the C(identity_provider_id) of a C(saml) selector, and a non-mapping
        selector value only for a null C(any_valid_service_token), which Cloudflare
        stores differently. Other such values, such as an empty C(saml) C(attribute_value),
        are sent.
      - access_apps, access_groups, access_policies, access_service_tokens, cfd_tunnel_configurations,
        devices_policy, devices_settings, dnssec, pagerules, pages_projects, rules_lists,
        rulesets, zerotrust_connectivity_settings, zones - when Cloudflare stores
        a value that differs from the requested one, such as an Access C(ip) selector
        C(192.0.2.1) stored as C(192.0.2.1/32), name the requested and stored value
        of each differing field in the failure message, and return them in C(differences),
        so that the value can be written as Cloudflare stores it.
      - access_apps, access_groups, access_service_tokens - an empty or whitespace-only
        O(access_groups#module:name) fails before any change; access_policies fails
        only for an empty name, as Cloudflare stores a whitespace-only one. pages_projects
        fails for an empty name or O(pages_projects#module:production_branch).
      - access_apps, pagerules, zones - add examples for absent resources, reusable
        and inline policies, destinations, page rule priority and status, and zone
        settings.
      - access_identity_providers_info, access_service_tokens, cfd_tunnel_info, warp_connector_info
        - add a ``<role>_no_log`` variable, defaulting to ``false``, that sets ``no_log``
        on the role's tasks to keep secrets out of output.
      - all modules - accept leading or trailing whitespace in O(production_branch)
        and C(name). A name Cloudflare stores with surrounding whitespace, such as
        that of an Access policy, cloudflared tunnel, or WARP Connector, is no longer
        reported as malformed, so it converges. Cloudflare trims Access application,
        group, and service token names, so a padded name there is not idempotent.
      - all modules - name the cause of a Cloudflare API connection failure or timeout
        in C(error), such as C(Connection error. ConnectError) followed by its message.
        A request HTTPX refused to build is named without its message, which can quote
        the API token.
      - all modules - only an empty or C(.)/C(..) C(phase) or C(_id) option, which
        the SDK cannot put in a request path, and a non-ASCII O(api_token) fail early.
        Whitespace in these options, an empty C(domain), and empty, whitespace-only,
        or control-character tokens are sent; Cloudflare or the SDK reports the error.
      - cfd_tunnel - no longer check O(cfd_tunnel#module:tunnel_secret); Cloudflare
        accepts base64 secrets shorter than 32 bytes. A tunnel can be created without
        O(cfd_tunnel#module:config_src).
      - devices_policy - send a C(service_mode_v2) C(port) without a C(mode) to Cloudflare,
        which rejects it; a C(port) with a mode other than C(proxy) still fails before
        any change. Null route and C(service_mode_v2) keys are ignored, as Cloudflare
        drops them.
      - devices_settings - describe C(disable_for_time) as the time, in seconds, that
        a user can use an override code to bypass WARP.
      - dns role - omit C(proxied), C(ttl), and C(timeout) when a record or zone does
        not set them, so the community.general.cloudflare_dns defaults apply instead
        of copies of them in the role.
      - dns role - pass each record's C(comment) and C(tags) to C(community.general.cloudflare_dns).
        A record that omits them has its comment or tags cleared, as C(community.general.cloudflare_dns)
        does.
      - pagerules - no longer check the C(value) keys of a C(cache_key_fields) action
        or that each target sets C(target), C(constraint.operator), and C(constraint.value);
        an action C(id) fails early only when it is a mapping or a list. Null target,
        constraint, action, and value keys are ignored. Only a O(pagerules#module:priority)
        of 0, or, outside check mode, one above the number of page rules the zone
        will have after the change, fails early; Cloudflare rejects a negative one.
      - pages_projects - accept null C(wrangler_config_hash), C(placement.mode), C(limits.cpu_ms),
        and environment variable C(value), which Cloudflare clears, and send null
        values and binding entry keys whose handling by Cloudflare is not verified,
        such as an C(r2_buckets) entry key. O(rotate_secrets) without a secret no
        longer fails.
      - pages_projects - with O(state=absent), delete only the project instead of
        first deleting each listed custom domain. Cloudflare detaches every custom
        domain when it deletes a project, so O(domains) no longer triggers separate
        domain deletes.
      - plugins - call Cloudflare through the generated SDK resources instead of raw
        API requests, so pagination, retries, and response parsing follow the SDK.
      - plugins - require Cloudflare SDK 5.10.0 or later.
      - plugins - share the API token, requirements, and check mode documentation
        through a documentation fragment.
      - purge_cache - allow combined purge types in O(purge_cache#module:cache), and
        send an empty O(cache), empty lists, and any file items to Cloudflare, which
        rejects them or purges nothing. The purge_cache role no longer skips an empty
        C(cache).
      - rules_lists - accept a C(redirect.target_url) with any scheme or without a
        host, such as C(ftp://example.com/) or C(https://), and a wildcard C(hostname.url_hostname)
        whose name has 252 characters, which Cloudflare stores. A new list without
        O(rules_lists#module:kind) is sent to Cloudflare, which rejects it.
      - rules_lists - when Cloudflare stores items that differ from the requested
        ones, name each requested value next to the stored value in the failure message,
        and return them as RV(missing_items) and RV(unexpected_items), so that an
        element such as C(redirect.source_url=example.com), stored as C(example.com/),
        can be written as Cloudflare stores it.
      - rulesets - a new ruleset without O(rulesets#module:name) is sent to Cloudflare,
        which rejects it.
      - warp_connector - check O(warp_connector#module:tunnel_secret) only when creating
        a connector, and only that it is non-empty base64 with or without padding;
        Cloudflare rejects other values only after the connector is created.
      - zones - accept a null C(pool_id) in the C(aegis) setting, which converges,
        ignore null unknown setting value keys, no longer check C(automatic_platform_optimization)
        values or the setting ids of an existing zone for whitespace, send a O(zones#module:name)
        of C(.) to Cloudflare as an empty name, and create a zone without O(zones#module:account_id)
        in the API token's account.
      - zones_info - document the C(type) and C(account) fields of each returned zone.
      release_summary: This release collects the fixes from a full audit of the collection's
        plugins and roles. Modules fail early on input Cloudflare would reject or
        never converge on, compare the settings they manage more exactly, and leave
        omitted settings unchanged instead of resetting them to defaults. Review the
        breaking changes before upgrading; several options lost defaults, and some
        roles no longer send values they previously forced.
