[tox]
env_list =
    ansible-lint
    ansible-test
    black-lint
    isort-lint
    ruff-lint
    unit
    yamllint
skipsdist = true
skip_missing_interpreters = true

[common]
ansible_home = {envtmpdir}/ansible_home
python_version = 3.13
ansible_collections_path = {[common]ansible_home}/collections
full_collection_path = {[common]ansible_collections_path}/ansible_collections/linuxhq/cloudflare
format_dirs = {toxinidir}/plugins {toxinidir}/tests
lint_dirs = {toxinidir}/plugins {toxinidir}/tests

[isort]
line_length = 120
profile = black
skip = .tox, tests/output
src_paths = plugins, tests/unit
sections = FUTURE,STDLIB,THIRDPARTY,ANSIBLE_CORE,ANSIBLE_LINUXHQ_CLOUDFLARE,LOCALFOLDER
known_ansible_core = ansible
known_ansible_linuxhq_cloudflare = ansible_collections.linuxhq.cloudflare

[testenv]
base_python = python{[common]python_version}
change_dir = {toxinidir}

[testenv:ansible-lint]
labels = lint
description = Run ansible-lint
deps =
    -r requirements.txt
commands = ansible-lint {posargs}

[testenv:ansible-test]
labels = lint
description = Run ansible-test from the required collection layout
deps =
    -r requirements.txt
allowlist_externals =
    git
    rsync
args_are_paths = false
change_dir = {[common]full_collection_path}
set_env =
    ANSIBLE_HOME={[common]ansible_home}
    ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
    ANSIBLE_COLLECTIONS_SCAN_SYS_PATH=false
commands_pre =
    rsync --delete --filter=':- .gitignore' --exclude=/.agents --exclude=/.claude --exclude=/.codex --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
    ansible-galaxy collection install -r {toxinidir}/requirements.yml -p {[common]ansible_collections_path}
    git init --quiet
    git add --all
commands = ansible-test {posargs:sanity} --python {[common]python_version} --requirements --venv-system-site-packages

[testenv:black]
labels = format
description = Format Python files
deps =
    -c requirements.txt
    black
commands = black {posargs:{[common]format_dirs}}

[testenv:black-lint]
labels = lint
description = Check Python formatting
deps = {[testenv:black]deps}
commands = black --check {posargs:{[common]format_dirs}}

[testenv:build]
description = Build the collection tarball
deps =
    -r requirements.txt
commands = ansible-galaxy collection build {posargs}

[testenv:changelog]
description = Manage changelog fragments and releases
deps =
    -c requirements.txt
    ansible
    antsibull-changelog
commands = antsibull-changelog {posargs:lint}

[testenv:isort]
labels = format
description = Sort Python imports
deps =
    -c requirements.txt
    isort
commands = isort {posargs:{[common]format_dirs}}

[testenv:isort-lint]
labels = lint
description = Check Python import sorting
deps = {[testenv:isort]deps}
commands = isort --check-only --diff {posargs:{[common]format_dirs}}

[testenv:molecule]
description = Run Molecule for the role named by MOLECULE_ROLE
deps =
    -r requirements.txt
allowlist_externals = rsync
change_dir = {toxinidir}/roles/{env:MOLECULE_ROLE}
pass_env =
    CLOUDFLARE_*
    SSH_AUTH_SOCK
set_env =
    ANSIBLE_HOME={[common]ansible_home}
    ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
commands_pre =
    rsync --delete --filter=':- .gitignore' --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
    ansible-galaxy collection install -r {toxinidir}/requirements.yml -p {[common]ansible_collections_path}
commands = molecule -c {toxinidir}/.config/molecule/tox.yml {posargs:syntax -s default}

[testenv:pre-commit]
description = Install the pre-commit hook
deps =
    -c requirements.txt
    pre-commit
commands = pre-commit install

[testenv:ruff]
labels = format
description = Fix Python lint findings
deps =
    -c requirements.txt
    ruff
commands = ruff check --fix {posargs:{[common]lint_dirs}}

[testenv:ruff-lint]
labels = lint
description = Check Python lint findings
deps = {[testenv:ruff]deps}
commands = ruff check {posargs:{[common]lint_dirs}}

[testenv:unit]
labels = unit
description = Run unit tests from the required collection layout
deps =
    -r requirements.txt
allowlist_externals = rsync
args_are_paths = false
change_dir = {[common]full_collection_path}
set_env =
    ANSIBLE_HOME={[common]ansible_home}
    ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
    PYTHONPATH={[common]ansible_collections_path}
commands_pre =
    rsync --delete --filter=':- .gitignore' --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
    ansible-galaxy collection install -r {toxinidir}/requirements.yml -p {[common]ansible_collections_path}
commands = pytest {posargs:tests/unit}

[testenv:yamllint]
labels = lint
description = Lint YAML files
deps =
    -c requirements.txt
    yamllint
commands = yamllint --strict {posargs:.}
