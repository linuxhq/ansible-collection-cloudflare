---
- name: Cleanup
  hosts: all
  pre_tasks:
    - name: Ensure zones are queried
      ansible.builtin.include_role:
        name: zones_info

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        cfd_tunnel_info_api_token: null
        warp_connector_info_api_token: null
        dns_records:
          "{{ [{'zone': zones_list.0.name,
                'records': dns_records.0.records |
                           map('combine', {'state': 'absent'}) |
                           list}]
              if zones_list.0.name in _zones_info_dict
              else [] }}"
        zones_list:
          "{{ zones_list |
              map('combine', {'state': 'absent'}) }}"

  roles:
    - dns
    - zones
...
