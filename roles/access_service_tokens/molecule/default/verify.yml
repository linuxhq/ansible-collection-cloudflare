---
- name: Verify
  hosts: all
  roles:
    - role: access_service_tokens_info
      access_service_tokens_info_account_id: "{{ _accounts_info_id }}"
      access_service_tokens_info_api_token: "{{ accounts_info_api_token }}"

  post_tasks:
    - name: Ensure service tokens are verified
      ansible.builtin.assert:
        that:
          - _access_service_tokens_info_dict[_item.name].duration == _item.duration
          - _access_service_tokens_info_dict[_item.name].id is defined
      loop: "{{ access_service_tokens_list }}"
      loop_control:
        label: "{{ _item.name | d(none) }}"
        loop_var: _item
...
