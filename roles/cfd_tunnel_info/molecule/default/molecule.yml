---
provisioner:
  inventory:
    group_vars:
      all:
        cfd_tunnel_list:
          - name: molecule-cfd-tunnel-info-local
            config_src: local
            tunnel_secret:
              "{{ lookup('ansible.builtin.password', '/dev/null',
                         chars=['ascii_letters', 'digits'], length=32) |
                  b64encode }}"

          - name: molecule-cfd-tunnel-info-remote
            config_src: cloudflare

        cfd_tunnel_info_include_token: true
...
