---
- name: Verify
  hosts: all

  roles:
    - cfd_tunnel_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-local'].account_tag is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-local'].config_src == 'local'
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-local'].id is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-local'].name is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-local'].status is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-local'].token is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-local'].tun_type == 'cfd_tunnel'
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-remote'].account_tag is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-remote'].config_src == 'cloudflare'
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-remote'].id is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-remote'].name is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-remote'].status is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-remote'].token is defined
          - _cfd_tunnel_info_dict['molecule-cfd-tunnel-info-remote'].tun_type == 'cfd_tunnel'
...
