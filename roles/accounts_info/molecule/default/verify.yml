---
- name: Verify
  hosts: all
  roles:
    - accounts_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _accounts_info_id is string
          - _accounts_info_id | length > 0
          - _accounts_info_name == accounts_info_name
          - _accounts_info_settings is mapping
          - _accounts_info_type in ['standard', 'enterprise']
...
