---
- name: Ensure cloudflare devices settings are managed
  tags:
    - devices_settings
  linuxhq.cloudflare.devices_settings:
    account_id: "{{ devices_settings_account_id }}"
    api_token: "{{ devices_settings_api_token }}"
    disable_for_time:
      "{{ devices_settings_disable_for_time
          if devices_settings_disable_for_time is not none
          else omit }}"
    gateway_proxy_enabled:
      "{{ devices_settings_gateway_proxy_enabled
          if devices_settings_gateway_proxy_enabled is not none
          else omit }}"
    gateway_udp_proxy_enabled:
      "{{ devices_settings_gateway_udp_proxy_enabled
          if devices_settings_gateway_udp_proxy_enabled is not none
          else omit }}"
    root_certificate_installation_enabled:
      "{{ devices_settings_root_certificate_installation_enabled
          if devices_settings_root_certificate_installation_enabled is not none
          else omit }}"
    use_zt_virtual_ip:
      "{{ devices_settings_use_zt_virtual_ip
          if devices_settings_use_zt_virtual_ip is not none
          else omit }}"
  when:
    - devices_settings_account_id is not none
    - devices_settings_api_token is not none
...
