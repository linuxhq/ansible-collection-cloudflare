---
- name: Verify
  hosts: all
  roles:
    - role: access_groups_info
      access_groups_info_account_id: "{{ _accounts_info_id }}"
      access_groups_info_api_token: "{{ accounts_info_api_token }}"

    - access_service_tokens_info

  post_tasks:
    - name: Ensure groups are verified
      ansible.builtin.assert:
        that:
          - _access_groups_info_dict[_item.name].include.0.service_token.token_id == _item.include.0.service_token.token_id
          - _access_groups_info_dict[_item.name].is_default | d(false) == _item.is_default
      loop: "{{ access_groups_list }}"
      loop_control:
        label: "{{ _item.name | d(none) }}"
        loop_var: _item
...
