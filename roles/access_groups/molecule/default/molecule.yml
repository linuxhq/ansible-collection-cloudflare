---
provisioner:
  inventory:
    group_vars:
      all:
        accounts_info_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        accounts_info_name: linuxhq-dev

        access_groups_account_id: "{{ _accounts_info_id }}"
        access_groups_api_token: "{{ accounts_info_api_token }}"
        access_groups_list:
          - name: molecule-access-groups-00
            include:
              - service_token:
                  token_id: "{{ _access_service_tokens_info_dict['molecule-access-groups-00'].id }}"
            is_default: false

          - name: molecule-access-groups-01
            include:
              - service_token:
                  token_id: "{{ _access_service_tokens_info_dict['molecule-access-groups-01'].id }}"
            is_default: false

          - name: molecule-access-groups-02
            include:
              - service_token:
                  token_id: "{{ _access_service_tokens_info_dict['molecule-access-groups-02'].id }}"
            is_default: false

        access_service_tokens_account_id: "{{ _accounts_info_id }}"
        access_service_tokens_api_token: "{{ accounts_info_api_token }}"
        access_service_tokens_info_account_id: "{{ _accounts_info_id }}"
        access_service_tokens_info_api_token: "{{ accounts_info_api_token }}"
        access_service_tokens_list:
          - name: molecule-access-groups-00
            duration: forever
          - name: molecule-access-groups-01
            duration: forever
          - name: molecule-access-groups-02
            duration: forever
...
