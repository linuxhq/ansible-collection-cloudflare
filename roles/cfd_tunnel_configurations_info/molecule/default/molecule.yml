---
provisioner:
  inventory:
    group_vars:
      all:
        cfd_tunnel_list:
          - name: molecule-cfd-tunnel-configurations-info
            config_src: cloudflare

        cfd_tunnel_configurations_list:
          - tunnel_id: "{{ _cfd_tunnel_info_dict['molecule-cfd-tunnel-configurations-info'].id }}"
            config:
              ingress:
                - hostname: organic.molecule.org
                  originRequest:
                    http2Origin: true
                    originServerName: organic.molecule.org
                  service: https://nginx:8443
                - hostname: inorganic.molecule.org
                  originRequest:
                    http2Origin: true
                    originServerName: inorganic.molecule.org
                  service: https://nginx:8443
                - service: http_status:404
...
