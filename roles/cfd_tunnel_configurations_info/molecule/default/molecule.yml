---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        accounts_info_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        accounts_info_name: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_NAME') }}"

        cfd_tunnel_account_id: "{{ _accounts_info_id }}"
        cfd_tunnel_api_token: "{{ accounts_info_api_token }}"
        cfd_tunnel_list:
          - name: molecule
            config_src: cloudflare

        cfd_tunnel_info_account_id: "{{ _accounts_info_id }}"
        cfd_tunnel_info_api_token: "{{ accounts_info_api_token }}"

        cfd_tunnel_configurations_account_id: "{{ _accounts_info_id }}"
        cfd_tunnel_configurations_api_token: "{{ accounts_info_api_token }}"
        cfd_tunnel_configurations_list:
          - tunnel_id: "{{ _cfd_tunnel_info_dict['molecule'].id }}"
            config:
              ingress:
                - hostname: organic.molecule.org
                  originRequest:
                    http2Origin: true
                    originServerName: organic.molecule.org
                  service: https://nginx:8443
                - hostname: inorganic.molecule.org
                  originRequest:
                    http2Origin: true
                    originServerName: inorganic.molecule.org
                  service: https://nginx:8443
                - service: http_status:404

        cfd_tunnel_configurations_info_account_id: "{{ _accounts_info_id }}"
        cfd_tunnel_configurations_info_api_token: "{{ accounts_info_api_token }}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
