---
- name: Verify
  hosts: all

  roles:
    - accounts_info

    - role: zones_info
      zones_info_api_token: "{{ zones_api_token }}"

  post_tasks:
    - name: Ensure zones are verified
      ansible.builtin.assert:
        that:
          - _zones_info_dict[_item.name].id is defined
          - _zones_info_dict[_item.name].type == _item.type
      loop: "{{ zones_list }}"
      loop_control:
        label: "{{ _item.name | d(none) }}"
        loop_var: _item

    - name: Ensure zones are managed without an account
      ansible.builtin.include_role:
        name: zones
      vars:
        zones_account_id: null

    - name: Ensure zones without an account are unchanged
      ansible.builtin.assert:
        that:
          - __zones_status.results | length == zones_list | length
          - __zones_status.results | select('changed') | list | length == 0

    - name: Ensure zone setting is updated
      linuxhq.cloudflare.zones:
        account_id: "{{ zones_account_id }}"
        api_token: "{{ zones_api_token }}"
        name: "{{ zones_list.0.name }}"
        settings:
          - id: min_tls_version
            value: 1.2
      register: __zones_result

    - name: Ensure zone setting update is verified
      ansible.builtin.assert:
        that:
          - __zones_result is changed
          - __zones_result.settings.0.id == 'min_tls_version'
          - __zones_result.settings.0.value | string == '1.2'
...
