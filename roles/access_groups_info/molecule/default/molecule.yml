---
provisioner:
  inventory:
    group_vars:
      all:
        access_groups_list:
          - name: molecule-access-groups-info-00
            include:
              - service_token:
                  token_id: "{{ _access_service_tokens_info_dict['molecule-access-groups-info-00'].id }}"
            is_default: false

          - name: molecule-access-groups-info-01
            include:
              - service_token:
                  token_id: "{{ _access_service_tokens_info_dict['molecule-access-groups-info-01'].id }}"
            is_default: false

          - name: molecule-access-groups-info-02
            include:
              - service_token:
                  token_id: "{{ _access_service_tokens_info_dict['molecule-access-groups-info-02'].id }}"
            is_default: false

        access_service_tokens_list:
          - name: molecule-access-groups-info-00
            duration: forever
          - name: molecule-access-groups-info-01
            duration: forever
          - name: molecule-access-groups-info-02
            duration: forever
...
