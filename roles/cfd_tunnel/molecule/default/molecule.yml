---
provisioner:
  inventory:
    group_vars:
      all:
        accounts_info_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        accounts_info_name: linuxhq-dev

        cfd_tunnel_account_id: "{{ _accounts_info_id }}"
        cfd_tunnel_api_token: "{{ accounts_info_api_token }}"
        cfd_tunnel_list:
          - name: molecule-cfd-tunnel-local
            config_src: local
            tunnel_secret:
              "{{ lookup('ansible.builtin.password', '/dev/null',
                         chars=['ascii_letters', 'digits'], length=32) |
                  b64encode }}"

          - name: molecule-cfd-tunnel-remote
            config_src: cloudflare
...
