---
- name: Verify
  hosts: all

  pre_tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        cfd_tunnel_list:
          "{{ cfd_tunnel_list |
              map('combine', {'state': 'absent'}) }}"
      diff: false
      no_log: true

  roles:
    - role: cfd_tunnel
      diff: false
      no_log: true
...
