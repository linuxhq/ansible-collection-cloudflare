---
- name: Verify
  hosts: all

  roles:
    - cfd_tunnel_info

  post_tasks:
    - name: Ensure cfd tunnels are verified
      ansible.builtin.assert:
        that:
          - _cfd_tunnel_info_dict[_cfd_tunnel.name].config_src == _cfd_tunnel.config_src
          - _cfd_tunnel_info_dict[_cfd_tunnel.name].id is defined
          - _cfd_tunnel_info_dict[_cfd_tunnel.name].tun_type == 'cfd_tunnel'
      loop: "{{ cfd_tunnel_list }}"
      loop_control:
        label: "{{ _cfd_tunnel.name | d(none) }}"
        loop_var: _cfd_tunnel
...
