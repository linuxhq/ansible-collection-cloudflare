---
provisioner:
  inventory:
    group_vars:
      all:
        accounts_info_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        accounts_info_name: linuxhq-dev

        dnssec_api_token: "{{ accounts_info_api_token }}"
        dnssec_list:
          - zone_id: "{{ _zones_info_dict[zones_list.0.name].id }}"
            status: active
          - zone_id: "{{ _zones_info_dict[zones_list.1.name].id }}"
            status: active
          - zone_id: "{{ _zones_info_dict[zones_list.2.name].id }}"
            status: active

        dnssec_info_api_token: "{{ accounts_info_api_token }}"

        zones_account_id: "{{ _accounts_info_id }}"
        zones_api_token: "{{ accounts_info_api_token }}"
        zones_list:
          - name: molecule-dnssec-info.com
            type: full
            settings:
              - id: always_use_https
                value: 'on'
              - id: development_mode
                value: 'on'
              - id: ipv6
                value: 'off'
              - id: min_tls_version
                value: 1.3
              - id: ssl
                value: strict

          - name: molecule-dnssec-info.net
            type: full
            settings:
              - id: always_use_https
                value: 'on'
              - id: development_mode
                value: 'on'
              - id: ipv6
                value: 'off'
              - id: min_tls_version
                value: 1.3
              - id: ssl
                value: strict

          - name: molecule-dnssec-info.org
            type: full
            settings:
              - id: always_use_https
                value: 'on'
              - id: development_mode
                value: 'on'
              - id: ipv6
                value: 'off'
              - id: min_tls_version
                value: 1.3
              - id: ssl
                value: strict

        zones_info_api_token: "{{ accounts_info_api_token }}"
...
