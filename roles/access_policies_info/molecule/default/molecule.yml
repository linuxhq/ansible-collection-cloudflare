---
provisioner:
  inventory:
    group_vars:
      all:
        access_groups_list:
          - name: molecule-access-policies-info-00
            include:
              - service_token:
                  token_id: "{{ _access_service_tokens_info_dict['molecule-access-policies-info-00'].id }}"
            is_default: false

        access_identity_providers_info_no_log: true

        access_policies_list:
          - name: molecule-access-policies-info-00-email
            decision: allow
            include:
              - email:
                  email: email@molecule.org

          - name: molecule-access-policies-info-00-group
            decision: non_identity
            include:
              - group:
                  id: "{{ _access_groups_info_dict['molecule-access-policies-info-00'].id }}"

        access_service_tokens_list:
          - name: molecule-access-policies-info-00
            duration: forever
...
