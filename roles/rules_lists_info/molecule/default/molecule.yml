---
provisioner:
  inventory:
    group_vars:
      all:
        rules_lists_hetrixtools:
          "{{ lookup('ansible.builtin.url',
                     'https://hetrixtools.com/resources/uptime-monitor-only-ips.txt',
                     wantlist=true) |
              map('community.general.dict_kv', 'ip') }}"

        rules_lists_uptimerobot:
          "{{ lookup('ansible.builtin.url',
                     'https://uptimerobot.com/inc/files/ips/IPv4.txt',
                     wantlist=true) |
              map('community.general.dict_kv', 'ip') }}"

        rules_lists_list:
          - kind: ip
            name: molecule_rules_lists_info_monitoring
            elements:
              "{{ rules_lists_hetrixtools +
                  rules_lists_uptimerobot }}"
...
