---
provisioner:
  inventory:
    group_vars:
      all:
        accounts_info_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        accounts_info_name: linuxhq-dev

        rules_lists_account_id: "{{ _accounts_info_id }}"
        rules_lists_api_token: "{{ accounts_info_api_token }}"
        rules_lists_hetrixtools:
          "{{ lookup('ansible.builtin.url',
                     'https://hetrixtools.com/resources/uptime-monitor-only-ips.txt',
                     wantlist=true) |
              map('community.general.dict_kv', 'ip') }}"

        rules_lists_uptimerobot:
          "{{ lookup('ansible.builtin.url',
                     'https://uptimerobot.com/inc/files/ips/IPv4.txt',
                     wantlist=true) |
              map('community.general.dict_kv', 'ip') }}"

        rules_lists_list:
          - kind: ip
            name: molecule_rules_lists_info_monitoring
            elements:
              "{{ rules_lists_hetrixtools +
                  rules_lists_uptimerobot }}"

        rules_lists_info_account_id: "{{ _accounts_info_id }}"
        rules_lists_info_api_token: "{{ accounts_info_api_token }}"
...
