---
- name: Verify
  hosts: all

  roles:
    - rules_lists_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _rules_lists_info_dict[rules_lists_list.0.name].kind == 'ip'
          - _rules_lists_info_dict[rules_lists_list.0.name].num_items | int ==
            rules_lists_list.0.elements | length

    - name: Ensure rules list elements are updated
      ansible.builtin.include_role:
        name: rules_lists
      vars:
        rules_lists_list:
          - kind: ip
            name: molecule_rules_lists_monitoring
            elements:
              - ip: 192.0.2.1
              - ip: 198.51.100.0/24
              - ip: 203.0.113.0/24

    - name: Ensure rules lists information is gathered
      ansible.builtin.include_role:
        name: rules_lists_info

    - name: Ensure update is verified
      ansible.builtin.assert:
        that:
          - _rules_lists_info_dict[rules_lists_list.0.name].num_items | int == 3
...
