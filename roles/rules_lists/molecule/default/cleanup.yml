---
- name: Cleanup
  hosts: all

  pre_tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        rules_lists_list:
          "{{ rules_lists_list |
              map('combine', {'state': 'absent'}) }}"

  roles:
    - rules_lists

  post_tasks:
    - name: Ensure rules lists information is gathered
      ansible.builtin.include_role:
        name: rules_lists_info

    - name: Ensure rules lists are absent
      ansible.builtin.assert:
        that:
          - rules_lists_list.0.name not in _rules_lists_info_dict
...
