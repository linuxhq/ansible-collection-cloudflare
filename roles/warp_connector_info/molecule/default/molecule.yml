---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        accounts_info_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        accounts_info_name: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_NAME') }}"

        warp_connector_account_id: "{{ _accounts_info_id }}"
        warp_connector_api_token: "{{ accounts_info_api_token }}"
        warp_connector_list:
          - name: molecule-00
          - name: molecule-01
          - name: molecule-02
          - name: molecule-03
          - name: molecule-04

        warp_connector_info_account_id: "{{ _accounts_info_id }}"
        warp_connector_info_api_token: "{{ accounts_info_api_token }}"
        warp_connector_info_include_token: true

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
