---
- name: Verify
  hosts: all

  roles:
    - zones_info

    - role: rulesets_info
      rulesets_info_api_token: "{{ rulesets_api_token }}"

  post_tasks:
    - name: Ensure rulesets are verified
      ansible.builtin.assert:
        that:
          - _rulesets_info_dict[zones_list.0.name].phase == 'http_request_firewall_custom'
          - _rulesets_info_dict[zones_list.0.name].rules | length == 2

    - name: Ensure ruleset rules are updated
      linuxhq.cloudflare.rulesets:
        api_token: "{{ rulesets_api_token }}"
        name: "{{ rulesets_list.0.name }}"
        phase: http_request_firewall_custom
        rules: "{{ rulesets_list.0.rules[:1] }}"
        zone_id: "{{ rulesets_list.0.zone_id }}"
      register: __rulesets_result

    - name: Ensure ruleset rules update is verified
      ansible.builtin.assert:
        that:
          - __rulesets_result is changed
          - __rulesets_result.ruleset.rules | length == 1
...
