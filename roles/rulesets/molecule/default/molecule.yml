---
provisioner:
  inventory:
    group_vars:
      all:
        zones_list:
          - name: molecule-rulesets.org
            type: full
            settings:
              - id: always_use_https
                value: 'on'
              - id: development_mode
                value: 'on'
              - id: ipv6
                value: 'off'
              - id: min_tls_version
                value: 1.3
              - id: ssl
                value: strict

        rulesets_list:
          - zone_id: "{{ _zones_info_dict[zones_list.0.name].id }}"
            name: default
            rules:
              - action: block
                description: US
                enabled: true
                expression: >-
                  (ip.geoip.country ne "US")

              - action: block
                description: Known Bots
                enabled: true
                expression: >-
                  (cf.client.bot)
...
