---
- name: Verify
  hosts: all

  roles:
    - role: pages_projects_info
      pages_projects_info_account_id: "{{ pages_projects_account_id }}"
      pages_projects_info_api_token: "{{ pages_projects_api_token }}"

  post_tasks:
    - name: Ensure pages projects are verified
      ansible.builtin.assert:
        that:
          - _pages_projects_info_dict[_pages_project.name].id is defined
          - _pages_projects_info_dict[_pages_project.name].production_branch ==
              _pages_project.production_branch
      loop: "{{ pages_projects_list }}"
      loop_control:
        label: "{{ _pages_project.name | d(none) }}"
        loop_var: _pages_project

    - name: Ensure custom domains are queried
      linuxhq.cloudflare.pages_projects:
        account_id: "{{ pages_projects_account_id }}"
        api_token: "{{ pages_projects_api_token }}"
        domains: "{{ _pages_project.domains }}"
        name: "{{ _pages_project.name }}"
      register: __pages_projects_domains
      check_mode: true
      loop: "{{ pages_projects_list }}"
      loop_control:
        label: "{{ _pages_project.name | d(none) }}"
        loop_var: _pages_project

    - name: Ensure custom domains are attached
      ansible.builtin.assert:
        that:
          - __pages_projects_domains is not changed
...
