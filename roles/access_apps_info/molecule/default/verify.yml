---
- name: Verify
  hosts: all

  roles:
    - access_apps_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _access_apps_info_dict['molecule'].domain == 'molecule.example.com'
          - _access_apps_info_dict['molecule'].id is defined
          - _access_apps_info_dict['molecule'].policies | length == 1
          - _access_apps_info_dict['molecule'].type == 'bookmark'
...
