---
provisioner:
  inventory:
    group_vars:
      all:
        access_identity_providers_info_no_log: true

        access_apps_list:
          - name: molecule-access-apps-info
            domain: molecule.example.com
            policies:
              - id: "{{ _access_policies_info_dict['molecule-access-apps-info-00-email'].id }}"
            type: bookmark

        access_policies_list:
          - name: molecule-access-apps-info-00-email
            decision: allow
            include:
              - email:
                  email: email@molecule.org
...
