---
- name: Verify
  hosts: all

  roles:
    - zones_info

  tasks:
    - name: Ensure cache purge is predicted in check mode
      linuxhq.cloudflare.purge_cache:
        api_token: "{{ purge_cache_api_token }}"
        cache: "{{ purge_cache_list.0.cache }}"
        zone_id: "{{ purge_cache_list.0.zone_id }}"
      register: __purge_cache_check
      check_mode: true

    - name: Ensure cache purge is executed
      linuxhq.cloudflare.purge_cache:
        api_token: "{{ purge_cache_api_token }}"
        cache:
          files:
            - https://linuxhq.dev/molecule-verify
        zone_id: "{{ purge_cache_list.0.zone_id }}"
      register: __purge_cache_result

    - name: Ensure cache purge is verified
      ansible.builtin.assert:
        that:
          - __purge_cache_check is changed
          - __purge_cache_check.purge_cache is not defined
          - __purge_cache_result is changed
          - __purge_cache_result.purge_cache.id == purge_cache_list.0.zone_id

    - name: Ensure cache purge without a zone fails
      block:
        - name: Ensure cache purge without a zone is attempted
          ansible.builtin.include_role:
            name: purge_cache
          vars:
            purge_cache_async: 0
            purge_cache_list:
              - cache:
                  purge_everything: true

        - name: Ensure cache purge without a zone did not succeed
          ansible.builtin.fail:
            msg: A purge_cache_list item without zone_id was not rejected

      rescue:
        - name: Ensure cache purge without a zone names the option
          ansible.builtin.assert:
            that:
              - "'missing required arguments: zone_id' in
                 (ansible_failed_result.results | d([]) |
                  map(attribute='msg', default='') | join(' '))"
...
