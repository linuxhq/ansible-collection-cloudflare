---
provisioner:
  inventory:
    group_vars:
      all:
        dnssec_list:
          - zone_id: "{{ _zones_info_dict[zones_list.0.name].id }}"
            status: active
          - zone_id: "{{ _zones_info_dict[zones_list.1.name].id }}"
            status: active
          - zone_id: "{{ _zones_info_dict[zones_list.2.name].id }}"
            status: active

        zones_list:
          - name: molecule-dnssec.com
            type: full
            settings:
              - id: always_use_https
                value: 'on'
              - id: development_mode
                value: 'on'
              - id: ipv6
                value: 'off'
              - id: min_tls_version
                value: 1.3
              - id: ssl
                value: strict

          - name: molecule-dnssec.net
            type: full
            settings:
              - id: always_use_https
                value: 'on'
              - id: development_mode
                value: 'on'
              - id: ipv6
                value: 'off'
              - id: min_tls_version
                value: 1.3
              - id: ssl
                value: strict

          - name: molecule-dnssec.org
            type: full
            settings:
              - id: always_use_https
                value: 'on'
              - id: development_mode
                value: 'on'
              - id: ipv6
                value: 'off'
              - id: min_tls_version
                value: 1.3
              - id: ssl
                value: strict
...
