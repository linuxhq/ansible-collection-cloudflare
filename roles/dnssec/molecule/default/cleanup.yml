---
- name: Cleanup
  hosts: all

  pre_tasks:
    - name: Ensure zones are queried
      ansible.builtin.include_role:
        name: zones_info

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        dnssec_list:
          "{{ zones_list |
              map(attribute='name') |
              select('in', _zones_info_dict) |
              map('extract', _zones_info_dict, 'id') |
              map('community.general.dict_kv', 'zone_id') |
              map('combine', {'status': 'disabled'}) }}"
        zones_list:
          "{{ zones_list |
              map('combine', {'state': 'absent'}) }}"

  roles:
    - dnssec
    - zones
...
