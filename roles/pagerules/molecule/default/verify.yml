---
- name: Verify
  hosts: all

  roles:
    - zones_info

    - pagerules_info

  post_tasks:
    - name: Ensure pagerules are verified
      ansible.builtin.assert:
        that:
          - _pagerules_info_dict[zones_list.0.name].pagerules | length == 2

    - name: Ensure pagerule status is updated
      linuxhq.cloudflare.pagerules:
        actions: "{{ pagerules_list.0.pagerules.1.actions }}"
        api_token: "{{ pagerules_api_token }}"
        priority: "{{ pagerules_list.0.pagerules.1.priority }}"
        status: disabled
        targets: "{{ pagerules_list.0.pagerules.1.targets }}"
        zone_id: "{{ pagerules_list.0.zone_id }}"
      register: __pagerules_result

    - name: Ensure pagerule status update is verified
      ansible.builtin.assert:
        that:
          - __pagerules_result is changed
          - __pagerules_result.pagerule.status == 'disabled'
...
