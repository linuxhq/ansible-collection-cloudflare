---
provisioner:
  inventory:
    group_vars:
      all:
        pagerules_list:
          - zone_id: "{{ _zones_info_dict[zones_list.0.name].id }}"
            pagerules:
              - actions:
                  - id: forwarding_url
                    value:
                      status_code: 301
                      url: https://docs.ansible.com/projects/molecule
                priority: 1
                status: active
                targets:
                  - constraint:
                      operator: matches
                      value: "molecule-pagerules.org/*"
                    target: url
              - actions:
                  - id: forwarding_url
                    value:
                      status_code: 301
                      url: https://docs.ansible.com/projects/molecule
                priority: 2
                status: active
                targets:
                  - constraint:
                      operator: matches
                      value: "www.molecule-pagerules.org/*"
                    target: url

        zones_list:
          - name: molecule-pagerules.org
            type: full
            settings:
              - id: always_use_https
                value: 'on'
              - id: development_mode
                value: 'on'
              - id: ipv6
                value: 'off'
              - id: min_tls_version
                value: 1.3
              - id: ssl
                value: strict
...
