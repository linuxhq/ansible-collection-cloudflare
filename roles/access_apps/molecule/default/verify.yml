---
- name: Verify
  hosts: all
  roles:
    - role: access_apps_info
      access_apps_info_account_id: "{{ _accounts_info_id }}"
      access_apps_info_api_token: "{{ accounts_info_api_token }}"

    - access_policies_info

  post_tasks:
    - name: Ensure apps are verified
      ansible.builtin.assert:
        that:
          - _access_apps_info_dict[_item.name].domain == _item.domain
          - _access_apps_info_dict[_item.name].policies | length == _item.policies | length
          - _access_apps_info_dict[_item.name].type == _item.type
      loop: "{{ access_apps_list }}"
      loop_control:
        label: "{{ _item.name | d(none) }}"
        loop_var: _item
...
