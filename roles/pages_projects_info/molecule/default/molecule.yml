---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        accounts_info_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
        accounts_info_name: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_NAME') }}"

        pages_projects_account_id: "{{ _accounts_info_id }}"
        pages_projects_api_token: "{{ accounts_info_api_token }}"
        pages_projects_list:
          - name: molecule-com
            production_branch: main
            domains:
              - name: molecule.com

          - name: molecule-net
            production_branch: main
            domains:
              - name: molecule.net

          - name: molecule-org
            production_branch: main
            domains:
              - name: molecule.org

        pages_projects_info_account_id: "{{ _accounts_info_id }}"
        pages_projects_info_api_token: "{{ accounts_info_api_token }}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
