---
- name: Verify
  hosts: all

  roles:
    - pages_projects_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _pages_projects_info_dict[_item].deployment_configs.preview | length > 0
          - _pages_projects_info_dict[_item].deployment_configs.production | length > 0
          - _pages_projects_info_dict[_item].domains.0 == _item ~ '.pages.dev'
          - _pages_projects_info_dict[_item].id is defined
          - _pages_projects_info_dict[_item].name is defined
          - _pages_projects_info_dict[_item].production_branch == 'main'
          - _pages_projects_info_dict[_item].subdomain == _item ~ '.pages.dev'
      loop:
        "{{ pages_projects_list |
            map(attribute='name', default=[]) }}"
      loop_control:
        label: "{{ _item | d(none) }}"
        loop_var: _item

    - name: Ensure custom domains are queried
      linuxhq.cloudflare.pages_projects:
        account_id: "{{ pages_projects_account_id }}"
        api_token: "{{ pages_projects_api_token }}"
        domains: "{{ _project.domains }}"
        name: "{{ _project.name }}"
      register: __pages_projects_info_domains
      check_mode: true
      loop: "{{ pages_projects_list }}"
      loop_control:
        label: "{{ _project.name | d(none) }}"
        loop_var: _project

    - name: Ensure custom domains are attached
      ansible.builtin.assert:
        that:
          - __pages_projects_info_domains is not changed

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        pages_projects_list:
          "{{ pages_projects_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _role }}"
      loop:
        - pages_projects
      loop_control:
        label: "{{ _role | d(none) }}"
        loop_var: _role
...
