---
- name: Verify
  hosts: all

  roles:
    - access_policies_info

    - access_groups_info
    - access_identity_providers_info

  post_tasks:
    - name: Ensure policies are verified
      ansible.builtin.assert:
        that:
          - _access_policies_info_dict[_item.name].decision == _item.decision
          - _access_policies_info_dict[_item.name].include | length == _item.include | length
          - _access_policies_info_dict[_item.name].require | length == _item.require | d([]) | length
      loop: "{{ access_policies_list }}"
      loop_control:
        label: "{{ _item.name | d(none) }}"
        loop_var: _item
...
